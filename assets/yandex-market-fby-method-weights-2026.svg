<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><rect width="100%" height="100%" fill="#fff"/><text x="60" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102330">Веса методики FBY Яндекс Маркета</text><text x="60" y="76" font-family="Arial,sans-serif" font-size="16" fill="#5E7890">8 критериев · сумма весов 100</text><text x="60" y="127" font-family="Arial,sans-serif" font-size="15" fill="#102330">C1 FBY-специфика и полнота процесса Яндекс Маркета</text><rect x="780" y="110" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="110" width="262.5" height="24" rx="4" fill="#0E3455"/><text x="1100" y="128" font-family="Arial,sans-serif" font-size="15" fill="#102330">15%</text><text x="60" y="185" font-family="Arial,sans-serif" font-size="15" fill="#102330">C2 Доставка и регулярность передачи на склады/транзитные точки Маркета</text><rect x="780" y="168" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="168" width="262.5" height="24" rx="4" fill="#0E3455"/><text x="1100" y="186" font-family="Arial,sans-serif" font-size="15" fill="#102330">15%</text><text x="60" y="243" font-family="Arial,sans-serif" font-size="15" fill="#102330">C3 Упаковка, маркировка и работа со сложными/маркируемыми категориями</text><rect x="780" y="226" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="226" width="315.0" height="24" rx="4" fill="#0E3455"/><text x="1100" y="244" font-family="Arial,sans-serif" font-size="15" fill="#102330">18%</text><text x="60" y="301" font-family="Arial,sans-serif" font-size="15" fill="#102330">C4 Грузовые места, паллеты, ярлыки, документы и слот</text><rect x="780" y="284" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="284" width="175.0" height="24" rx="4" fill="#0E3455"/><text x="1100" y="302" font-family="Arial,sans-serif" font-size="15" fill="#102330">10%</text><text x="60" y="359" font-family="Arial,sans-serif" font-size="15" fill="#102330">C5 WMS, контроль, прослеживаемость и интеграции</text><rect x="780" y="342" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="342" width="210.0" height="24" rx="4" fill="#0E3455"/><text x="1100" y="360" font-family="Arial,sans-serif" font-size="15" fill="#102330">12%</text><text x="60" y="417" font-family="Arial,sans-serif" font-size="15" fill="#102330">C6 Скорость обработки и способность масштабировать партию</text><rect x="780" y="400" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="400" width="210.0" height="24" rx="4" fill="#0E3455"/><text x="1100" y="418" font-family="Arial,sans-serif" font-size="15" fill="#102330">12%</text><text x="60" y="475" font-family="Arial,sans-serif" font-size="15" fill="#102330">C7 Предсказуемость и прозрачность стоимости</text><rect x="780" y="458" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="458" width="140.0" height="24" rx="4" fill="#0E3455"/><text x="1100" y="476" font-family="Arial,sans-serif" font-size="15" fill="#102330">8%</text><text x="60" y="533" font-family="Arial,sans-serif" font-size="15" fill="#102330">C8 Операционная ответственность и измеримые подтверждения надежности</text><rect x="780" y="516" width="300" height="24" rx="4" fill="#E9EEF3"/><rect x="780" y="516" width="175.0" height="24" rx="4" fill="#0E3455"/><text x="1100" y="534" font-family="Arial,sans-serif" font-size="15" fill="#102330">10%</text></svg>